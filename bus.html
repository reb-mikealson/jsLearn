<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            margin-left:12px;
            color:aliceblue;
        }
        h3{
            margin-left:50px;
            color:aqua;
        }
    </style>
</head>
<body>
    <div style ="border:2px solid blue; width:400px;height:1000px; background-color:lightcoral;">
        <center>
            <img src="https://thumbs.dreamstime.com/b/bus-ticket-bus-front-view-logo-design-buying-tickets-online-transport-service-vector-design-public-transportation-ticket-245861626.jpg" alt="" height="100px" width="100px" style="border-radius: 50%; margin-top: 10%;">
            <h2 style="color: white;">Bus Booking System</h2>
        </center>
        <h3>User Information</h3>
        <p>User Name:<input type ="text"></p>
        <p>User Age:<input type="number"></p>
        <p>Aadhar Number:<input type="number"></p>
        <p>Select your city:<select name="" id="">
            <option value="">Delhi</option>
            <option value="">Ghaziabad</option>
            <option value="">Meerut</option>
            <option value="">Bareilly</option>
        </select></p>
        <p>Select your traveling date:<input type="date"></p>
        <h3>Bus Information</h3>
        <p>Select your bus type:</p>
        <input type="radio" name="bus" id="">AC-1000Rs
        <input type="radio" name="bus" id="">Non-AC-500Rs
        <p>Select your seat<select name ="" id ="">
            <option value ="">1</option>
            <option value ="">2</option>
            <option value ="">3</option>
            <option value ="">4</option>
            <option value ="">5</option>
        </select></p>
        <input type="submit" value="click for save">
    </div>
</body>
</html>
