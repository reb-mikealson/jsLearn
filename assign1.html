<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //we will take values from user and store in object
        const store=
        {
            tea:450,
            coffee:500,
            sugar:600,
            pulse:700
        }
        const x=prompt("enter the product");
        if(store[x]){
            const quant=prompt("enter the quantity");
            const total=store[x]*quant;
        }
        document.write("Total amout is:"+total);
    </script>
</body>
</html>
